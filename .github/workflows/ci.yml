name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The live Gemini test is behind the integration build tag and needs a key,
      # so it never runs here. Vetting its file keeps it compiling instead of
      # silently rotting between releases.
      - name: Vet the opt-in integration test
        run: go vet -tags=integration ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...
